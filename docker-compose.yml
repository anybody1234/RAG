# Hạ tầng cho môi trường dev. Backend, worker và frontend chạy trực tiếp trên máy.
# Giới hạn RAM vì máy dev thường chỉ trống khoảng 3GB.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2  # cùng minor với qdrant-client trong requirements.txt
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 128m
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
