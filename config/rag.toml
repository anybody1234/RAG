# Siêu tham số RAG. Đổi bất kỳ giá trị nào (trừ bảng [prices] ở cuối) thì phải tăng config_version
# và chạy lại eval (xem quy tắc trong CLAUDE.md).
# v0.2 (06/10/2026): chốt sau P4, trong giới hạn SLO (xem docs/experiments.md). So với v0.1-baseline:
# embedding large, chunk mang tên văn bản, RRF k = 2 với dense × 2, viết lại câu hỏi ở lượt hỏi tiếp.
config_version = "v0.2"

[chunking]
# Đơn vị chính là Điều; Điều dài hơn max_tokens thì tách theo Khoản.
max_tokens = 800
overlap_ratio = 0.1

[embedding]
model = "text-embedding-3-large"
dimensions = 3072

[sparse]
# BM25: phần TF tính ở client, IDF do Qdrant tính (modifier idf).
k1 = 1.2
b = 0.75
# Số token (âm tiết/từ) trung bình của một chunk, đo trên 1282 chunk của bộ dev với chunking ở trên
# (chưa tính dòng tên văn bản của embed_title).
avg_doc_len = 215

[query]
# Xử lý câu hỏi trước khi truy xuất, gộp trong một lần gọi `model`:
# - rewrite: viết lại câu hỏi thành câu độc lập theo lịch sử hội thoại (chỉ gọi khi có lịch sử);
# - translate: thêm bản dịch sang ngôn ngữ còn lại (vi <-> en), truy xuất bằng cả hai câu rồi gộp RRF.
#   Bật translate thì phải gọi model ở mọi lượt.
model = "gpt-6-luna"
reasoning_effort = "none"
prompt_version = "query-v1"
rewrite = true
# Tắt: dịch câu hỏi sửa được câu khác ngôn ngữ nhưng phải gọi model ở mọi lượt (p50 ~2.2 s), vượt SLO.
translate = false
translation_weight = 1.0   # trọng số RRF của các nhánh truy xuất bằng câu dịch (câu gốc có trọng số 1)

[retrieval]
mode = "hybrid"        # dense | sparse | hybrid
prefetch_limit = 50    # số ứng viên mỗi nhánh trước khi gộp RRF
rrf_k = 2              # hằng số k của RRF: score = Σ 1/(k + hạng/w − 1). Mặc định của Qdrant là 2.
dense_weight = 2.0     # trọng số w của nhánh dense trong RRF
sparse_weight = 1.0    # trọng số w của nhánh sparse trong RRF
top_k = 5              # số chunk đưa cho LLM
reranker = "none"      # none | llm. Tắt: rerank bằng Luna mất p50 ~1.5 s, vượt SLO.

[rerank]
# Rerank listwise bằng LLM (khi retrieval.reranker = "llm"): một lần gọi, xếp lại `candidates` chunk đầu.
model = "gpt-6-luna"
reasoning_effort = "none"
prompt_version = "rerank-v1"
candidates = 50
max_chunk_tokens = 200     # mỗi chunk chỉ đưa chừng này token đầu vào prompt

[index]
# Tên collection đầy đủ: <collection_prefix>_<model embedding>_<số chiều>.
collection_prefix = "chunks"
# Thêm "<tên văn bản> (<số hiệu>) | <heading_path>" lên đầu text đem embed và mã hoá sparse, để chunk mang
# ngữ cảnh văn bản. Payload vẫn giữ text gốc.
embed_title = true

[generation]
answer_model = "gpt-6.1-sol"
answer_reasoning_effort = "low"
prompt_version = "answer-v1"   # prompt trong backend/app/generation/prompts.py
max_output_tokens = 2000       # gồm cả token suy luận; chặn trên chi phí và thời gian của một câu trả lời

[eval]
judge_model = "gpt-6.1-sol"
judge_reasoning_effort = "high"
judge_prompt_version = "judge-v1"   # file eval/judges/<judge_prompt_version>.md
judge_max_output_tokens = 16000

# Giá USD cho 1M token: `input` là token đầu vào, `output` là token đầu ra (model embedding không có output).
# `cached_input`: token đầu vào đọc từ prompt cache; `cache_write`: token đầu vào ghi vào prompt cache
# (xem EXPLICIT_CACHE trong backend/app/retrieval/llm.py). Prompt trên 272k token có giá gấp đôi; pipeline không
# gửi prompt dài như vậy nên không khai báo.
# Chỉ dùng để tính chi phí ($) ghi vào trace và kết quả eval, không ảnh hưởng kết quả RAG, nên đổi giá
# không cần tăng config_version. Mọi model gọi trong pipeline (embedding, viết lại câu hỏi, rerank, trả lời,
# judge) phải có giá ở đây; thiếu thì RagConfig.price() báo lỗi thay vì tính chi phí bằng 0.
# Tra lại trang giá OpenAI trước khi đổi model.
# Đã đối chiếu với developers.openai.com/api/docs/pricing ngày 2026-10-06 (bảng Standard, cột Input / Cached input /
# Cache writes / Output, ngữ cảnh ngắn ≤ 272k token). Quy tắc ghi cache tính 1.25 lần giá input từ GPT-5.6 nằm ở
# developers.openai.com/api/docs/guides/prompt-caching.
[prices."text-embedding-3-small"]
input = 0.02

[prices."text-embedding-3-large"]
input = 0.13

[prices."gpt-6-luna"]
input = 0.10
cached_input = 0.01
cache_write = 0.125
output = 0.50

[prices."gpt-6.1-sol"]
input = 2.00
cached_input = 0.10
cache_write = 2.50
output = 10.00
